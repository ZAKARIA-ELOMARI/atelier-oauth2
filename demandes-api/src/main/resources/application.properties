server.port=8081

# Emetteur des jetons : Spring Security recupere les cles publiques du realm Keycloak
# pour verifier la signature, l'emetteur (iss) et l'expiration (exp) de chaque JWT.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/enset-realm

# Affiche le message des erreurs (ex. "Objet obligatoire") dans la reponse JSON
server.error.include-message=always
